name: Release

# Push a tag like v0.2.0 to build and publish installers. The tag MUST match "version" in package.json.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check tag matches package.json
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match version $v"; exit 1; }
      - run: npm ci
      # Signing env vars MUST be absent, not empty: electron-builder reads an empty CSC_LINK as a path.
      - name: Load macOS signing secrets
        if: runner.os == 'macOS' && env.MAC_CERT != ''
        shell: bash
        env:
          MAC_CERT: ${{ secrets.MAC_CERT_P12_BASE64 }}
        run: |
          {
            echo "CSC_LINK=${{ secrets.MAC_CERT_P12_BASE64 }}"
            echo "CSC_KEY_PASSWORD=${{ secrets.MAC_CERT_PASSWORD }}"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}"
            echo "APPLE_APP_SPECIFIC_PASSWORD=${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
            echo "SIGNED=1"
          } >> "$GITHUB_ENV"
      - name: Build and publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          extra=""
          # Without a certificate the macOS build is unsigned. It installs, but cannot auto-update.
          if [ "$RUNNER_OS" = "macOS" ] && [ -z "$SIGNED" ]; then
            extra="-c.mac.identity=null -c.mac.notarize=false"
          fi
          npx vite build
          npx electron-builder --publish always $extra
